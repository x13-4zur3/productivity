services:
  - type: web
    name: productivity-
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements-server.txt
    startCommand: python web_pwa.py serve --host 0.0.0.0 --port "$PORT" --allow-registration
    healthCheckPath: /api/health
    envVars:
      - key: PRODUCTIVITY_DATABASE_URL
        sync: false
