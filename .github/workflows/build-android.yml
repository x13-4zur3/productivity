name: Build Productivity Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build the APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk \
            "$RUNNER_TEMP/Productivity-Android-1.1.0-debug.apk"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/Productivity-Android-1.1.0-debug.apk
          archive: false
          if-no-files-found: error
