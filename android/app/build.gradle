plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'io.github.x13_4zur3.productivity'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.x13_4zur3.productivity'
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName '1.1.0'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def sharedDirectory = layout.buildDirectory.dir('generated/productivity/python')
def sharedSource = tasks.register('syncProductivitySource', Sync) {
    from(rootProject.projectDir.parentFile) {
        include 'app.py', 'desktop_accounts.py', 'desktop_server.py', 'account-service.json', 'static/**'
    }
    into(sharedDirectory)
}

chaquopy {
    defaultConfig {
        version = '3.13'
        pyc {
            src = false
        }
    }
    sourceSets.getByName('main') {
        srcDir(sharedDirectory.get().asFile)
    }
}

tasks.matching { it.name.startsWith('merge') && it.name.endsWith('PythonSources') }.configureEach {
    dependsOn(sharedSource)
}
