pluginManagement {
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.chaquo.python' && requested.version != null) {
                // Resolve Chaquopy without relying on its separate plugin marker.
                useModule("com.chaquo.python:gradle:${requested.version}")
            }
        }
    }
      
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'Productivity'
include ':app'
