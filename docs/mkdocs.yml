site_name: Productivity Docs
site_description: Install Productivity and learn to use its journal, tasks, calendar, focus timer, and accounts.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, 'https://productivity.readthedocs.org/en/latest/']
repo_name: x13-4zur3/productivity
repo_url: https://github.com/x13-4zur3/productivity
edit_uri: edit/main/docs/pages/
docs_dir: pages
strict: true

theme:
  name: material
  language: en
  logo: assets/productivity.png
  favicon: assets/productivity.png
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - navigation.sections
    - navigation.footer
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - assets/docs.css

nav:
  - Start here:
      - Overview: index.md
      - Install & update: install.md
      - What's new: changes.md
  - User guide:
      - Calendar & weekly planner: calendar.md
      - Journal, tasks & focus: use.md
      - Accounts & data: accounts.md
      - Troubleshooting: troubleshooting.md
  - Developers:
      - Build from source: build.md
      - Host the account service: hosting.md
